services:
  - type: web
    name: tracuufb-baoduy-api
    runtime: node
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_ORIGIN
        value: https://nguyenhaoduy-bdi.github.io
      - key: SITE_URL
        value: https://nguyenhaoduy-bdi.github.io/TraCuuFb/
      - key: SESSION_SECRET
        generateValue: true
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: GRAPH_API_VERSION
        value: v27.0
